[package]
name = "mermaid-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Pure-Rust Mermaid diagram parser and SVG renderer — no browser, no Node.js"
license = "MIT"
repository = "https://github.com/launcher-rs/mermaid-renderer"
readme = "README.md"
keywords = ["mermaid", "diagram", "svg", "flowchart", "renderer"]
categories = ["visualization", "text-processing"]

# 只提供库形式的 SVG 渲染：不含 cli / png feature，也不含命令行可执行文件。

[package.metadata.docs.rs]
all-features = true

[lib]
name = "mermaid_renderer"
path = "src/lib.rs"

[features]
default = []

[[test]]
name = "aspect_fold_suite"
path = "tests/aspect_fold_suite.rs"

[[test]]
name = "correctness_suite"
path = "tests/correctness_suite.rs"

[[test]]
name = "determinism_suite"
path = "tests/determinism_suite.rs"

[[test]]
name = "invariant_suite"
path = "tests/invariant_suite.rs"

[[test]]
name = "layout_suite"
path = "tests/layout_suite.rs"

[[test]]
name = "output_shape_suite"
path = "tests/output_shape_suite.rs"

[[test]]
name = "parse_errors"
path = "tests/parse_errors.rs"

[[test]]
name = "robustness_suite"
path = "tests/robustness_suite.rs"

[[test]]
name = "semantic_suite"
path = "tests/semantic_suite.rs"

[[test]]
name = "visual_issue_suite"
path = "tests/visual_issue_suite.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.fontdb]
version = "0.23"

[dependencies.json5]
version = "1.3"

[dependencies.once_cell]
version = "1.21.4"

[dependencies.regex]
version = "1.12"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.ttf-parser]
version = "0.25"
